<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>mb-emotes</title>
  <style>
    :root { --green:#36ff9f; --green-hover:#2bcc7f; --green-text:#333333; --green-10:rgba(54,255,159,0.1); --green-15:rgba(54,255,159,0.15); --green-20:rgba(54,255,159,0.2); --green-30:rgba(54,255,159,0.3); --green-40:rgba(54,255,159,0.4); --panel:rgba(14,14,14,0.95); --page:#0e0e0e; --header:#141414; --surface:#181818; --float:#161616; --row:#111111; --control:#222222; --control-hover:#333333; --line:rgba(255,255,255,0.04); --line-strong:rgba(255,255,255,0.1); --text:#ffffff; --text-2:rgba(255,255,255,0.8); --text-3:rgba(255,255,255,0.5); --text-4:rgba(255,255,255,0.22); --danger:#f87171; --danger-solid:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; overflow:hidden; font-family:"Inter","Segoe UI",system-ui,sans-serif; background:transparent; color:var(--text); }
    #root { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    #panel { pointer-events:auto; width:820px; max-width:96vw; height:82vh; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; box-shadow:0 0 40px rgba(0,0,0,0.5); display:none; flex-direction:column; overflow:hidden; animation:pop .18s ease-out; }
    #panel.show { display:flex; }
    @keyframes pop { from{transform:scale(.96);opacity:0} to{transform:scale(1);opacity:1} }
    .header { padding:14px 18px 12px; border-bottom:1px solid var(--line-strong); display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--header); }
    .brand { font-size:15px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--green); }
    .search { flex:1; max-width:320px; padding:7px 12px; background:var(--control); border:1px solid var(--line-strong); border-radius:6px; color:var(--text); font-size:13px; outline:none; }
    .search:focus { border-color:var(--green); box-shadow:0 0 8px rgba(54,255,159,0.2); }
    .close { padding:6px 12px; background:var(--green-15); border:1px solid var(--green); border-radius:6px; color:var(--green); font-weight:600; cursor:pointer; font-size:11px; }
    .close:hover { background:var(--green); color:var(--green-text); }
    .tabs { display:flex; gap:4px; padding:8px 18px; border-bottom:1px solid var(--line-strong); overflow-x:auto; background:var(--header); }
    .tab { padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px; color:var(--text-3); background:transparent; border:1px solid transparent; transition:all .12s; white-space:nowrap; }
    .tab:hover { color:var(--text); background:rgba(255,255,255,0.05); }
    .tab.active { color:var(--green); background:var(--green-15); border-color:var(--green); font-weight:600; }
    .body { flex:1; display:flex; overflow:hidden; }
    .grid { flex:1; overflow-y:auto; padding:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; align-content:start; }
    .grid::-webkit-scrollbar { width:6px; }
    .grid::-webkit-scrollbar-thumb { background:rgba(54,255,159,0.3); border-radius:3px; }
    .card { background:var(--row); border:1px solid var(--line); border-radius:8px; padding:10px 8px; cursor:pointer; transition:all .12s; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; }
    .card:hover { background:var(--control); border-color:var(--green); transform:translateY(-1px); }
    .card .icon { font-size:16px; color:var(--green); }
    .card .name { font-size:11px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }
    .footer { padding:8px 18px; border-top:1px solid var(--line-strong); display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-3); background:var(--header); }
    .footer .count { color:var(--green); font-weight:700; }
    .empty { color:var(--text-3); font-size:13px; padding:40px; text-align:center; grid-column:1/-1; }
  </style>
</head>
<body>
  <div id="root">
    <div id="panel">
      <div class="header">
        <div class="brand">Emote Menu</div>
        <input class="search" id="search" placeholder="Search emotes..." />
        <button class="close" id="closeBtn">Close</button>
      </div>
      <div class="tabs" id="tabs">
        <div class="tab active" data-cat="all">All</div>
        <div class="tab" data-cat="fav">Favorites</div>
        <div class="tab" data-cat="recent">Recent</div>
        <div class="tab" data-cat="scenario">Scenarios</div>
        <div class="tab" data-cat="dance">Dances</div>
        <div class="tab" data-cat="gesture">Gestures</div>
      </div>
      <div class="body">
        <div class="grid" id="grid"></div>
      </div>
      <div class="footer">
        <span><span class="count" id="count">0</span> emotes</span>
        <span>Click to play · ESC to close · Right-click to favorite</span>
      </div>
    </div>
  </div>
  <script>
    const panel = document.getElementById('panel');
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const count = document.getElementById('count');
    const closeBtn = document.getElementById('closeBtn');
    const tabs = [...document.querySelectorAll('.tab')];
    let emotes = [];
    let activeCat = 'all';
    let favorites = JSON.parse(localStorage.getItem('mbemotes_fav') || '[]');
    let recent = JSON.parse(localStorage.getItem('mbemotes_recent') || '[]');

    function saveFav() { localStorage.setItem('mbemotes_fav', JSON.stringify(favorites)); }
    function saveRecent() { localStorage.setItem('mbemotes_recent', JSON.stringify(recent)); }

    function render() {
      const q = search.value.toLowerCase();
      let items = emotes;
      if (activeCat === 'fav') items = favorites.map(n => emotes.find(e => e.name === n)).filter(Boolean);
      else if (activeCat === 'recent') items = recent.map(n => emotes.find(e => e.name === n)).filter(Boolean);
      else if (activeCat === 'scenario') items = items.filter(e => e.type === 'scenario');
      else if (activeCat === 'dance') items = items.filter(e => /dance/i.test(e.name) || /dance/i.test(e.label));
      else if (activeCat === 'gesture') items = items.filter(e => /wave|salute|point|thumbs|shrug|nod|clap|beckon|surrender|finger/i.test(e.name));
      if (q) items = items.filter(e => (e.label || e.name).toLowerCase().includes(q) || e.name.toLowerCase().includes(q));
      if (items.length === 0) { grid.innerHTML = '<div class="empty">No emotes found</div>'; count.textContent = 0; return; }
      grid.innerHTML = items.map(e => `<div class="card" data-name="${e.name}"><span class="icon">▶</span><span class="name">${e.label || e.name}</span></div>`).join('');
      count.textContent = items.length;
      grid.querySelectorAll('.card').forEach(el => {
        el.onclick = () => {
          const name = el.getAttribute('data-name');
          fetch('https://mb-emotes/playEmote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
          if (!recent.includes(name)) { recent.unshift(name); if (recent.length > 20) recent.pop(); saveRecent(); }
          // Close the menu after picking an emote.
          fetch('https://mb-emotes/close', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          panel.classList.remove('show');
        };
        el.oncontextmenu = (ev) => {
          ev.preventDefault();
          const name = el.getAttribute('data-name');
          if (favorites.includes(name)) favorites = favorites.filter(x => x !== name);
          else favorites.push(name);
          saveFav();
          render();
        };
      });
    }

    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.action !== 'open') return;
      emotes = d.emotes || [];
      render();
      search.value = '';
      panel.classList.add('show');
    });

    search.addEventListener('input', render);
    closeBtn.onclick = () => { fetch('https://mb-emotes/close', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); panel.classList.remove('show'); };
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => { document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active'); activeCat = t.getAttribute('data-cat'); render(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBtn.click(); });
  </script>
</body>
</html>
